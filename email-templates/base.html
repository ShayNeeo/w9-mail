<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{title}</title>
</head>
<body style="margin:0;padding:0;background-color:#160c13;font-family:'VT323','Press Start 2P',monospace;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#160c13;padding:20px;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table width="600" cellpadding="0" cellspacing="0" style="background-color:#160c13;border:4px solid #000;box-shadow:5px 5px 0 #000;max-width:600px;">
                    <!-- Header with Logo -->
                    <tr>
                        <td style="background-color:#32305a;padding:20px;text-align:center;border-bottom:4px solid #000;">
                            <img src="https://db.w9.nu/w9-logo/logo-landscape-transparent.svg" alt="W9 Labs" style="max-width:400px;height:auto;image-rendering:pixelated;" width="400"/>
                            <h1 style="font-family:'Press Start 2P',monospace;font-size:20px;color:#fce126;text-shadow:4px 4px 0 #000;margin:10px 0 0;">{title}</h1>
                        </td>
                    </tr>
                    
                    <!-- Content -->
                    <tr>
                        <td style="padding:30px;color:#fff;font-size:18px;line-height:1.6;font-family:'VT323',monospace;">
                            {content}
                        </td>
                    </tr>
                    
                    <!-- CTA Button -->
                    {cta_section}
                    
                    <!-- Footer -->
                    <tr>
                        <td style="background-color:#32305a;padding:15px;text-align:center;border-top:2px solid #7f8aa8;font-size:14px;color:#7f8aa8;font-family:'VT323',monospace;">
                            <img src="https://db.w9.nu/w9-logo/workmark-transparent.svg" alt="W9 Labs" style="height:20px;image-rendering:pixelated;opacity:0.7;" width="auto"/>
                            <p style="margin:5px 0 0;">W9 DB — OAuth 2.0 / OIDC Provider</p>
                            <p style="margin:0;font-size:12px;">Central authentication for the W9 Network</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
