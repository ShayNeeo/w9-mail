version: '3.8'

services:
  w9-mail:
    image: ghcr.io/${GITHUB_USER:-w9labs}/w9-mail:latest
    container_name: w9-mail
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.w9-mail.rule=Host(`mail.w9.nu`)"
      - "traefik.http.routers.w9-mail.entrypoints=websecure"
      - "traefik.http.routers.w9-mail.tls=true"
      - "traefik.http.services.w9-mail.loadbalancer.server.port=8080"
    ports:
      - "${W9_MAIL_PORT:-10106}:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL:-memory}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - ISSUER_URL=${ISSUER_URL:-https://db.w9.nu}
      - W9_DB_API_URL=${W9_DB_API_URL:-https://db.w9.nu}
      - SMTP_HOST=${SMTP_HOST:-smtp-mail.outlook.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TLS=${SMTP_TLS:-starttls}
      - DEFAULT_FROM=${DEFAULT_FROM:-W9 Mail <noreply@w9.nu>}
      - BASE_URL=${BASE_URL:-https://mail.w9.nu}
    networks:
      - w9-network
    depends_on:
      - w9-db
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # w9-db dependency (OAuth provider + SurrealDB)
  w9-db:
    image: ghcr.io/w9labs/w9-db:latest
    container_name: w9-mail-w9-db
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
    ports:
      - "${W9_DB_PORT:-8082}:8082"
    environment:
      - HOST=0.0.0.0
      - PORT=8082
      - DATABASE_URL=${W9_DB_DATABASE_URL:-memory}
      - JWT_SECRET=${W9_DB_JWT_SECRET:-change-me-in-production}
      - ISSUER_URL=${W9_DB_ISSUER_URL:-https://db.w9.nu}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@w9.nu}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-W9AdminSecure123!}
    volumes:
      - w9-db-data:/app/data
    networks:
      - w9-network

  # Watchtower for auto-updates
  watchtower:
    image: containrrr/watchtower:latest
    container_name: w9-mail-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_LABEL_ENABLE=true
    command: --interval 300 --scope w9-mail --scope w9-mail-w9-db
    networks:
      - w9-network

volumes:
  w9-db-data:
    driver: local

networks:
  w9-network:
    external: true
